# Source registry entry. One file per source; file name = id. Underscore prefix = ignored.
# Platform source (one adapter, many cities): only platform + tenant + jurisdiction change.
id: legistar-example
name: Example City — meetings (Legistar Web API)
platform: legistar            # legistar | custom | fixture
tenant: example               # platform client id
kind: api                     # api | html | js | pdf_index
entry: https://webapi.legistar.com/v1/example
jurisdiction: { id: us-xx-example, name: Example City, state: XX }
allowed_hosts: [webapi.legistar.com]   # entry host is always allowed; add document hosts here
cadence: daily
politeness: { rps: 1, concurrency: 1, respect_robots: true }
legal:
  terms_checked: 2026-11-17   # review terms/robots before activating (CLAUDE.md §6)
  notes: "Why collecting this is allowed; what is excluded."
schema: Meeting
locale: { language: en-US, timezone: America/Chicago, date_order: mdy, currency: USD }  # how the source writes dates, times, numbers and prices
watermark: { field: source_modified_at, initial_lookback_days: 365, overlap_hours: 24 }
adapter: scrapeline.adapters.platforms.legistar:LegistarAdapter
pagination: offset            # none | next-link | page-number | cursor | load-more | offset
max_pages_per_run: 50
status: draft                 # draft | active | broken | retired (DB owns it after first sync)
config_version: 1
quality: { min_records: 1, max_records: 20000, max_reject_rate: 0.05 }
