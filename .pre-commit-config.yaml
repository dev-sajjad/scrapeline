repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy --strict
        entry: uv run mypy src
        language: system
        pass_filenames: false
        types: [python]
      - id: no-env-file
        name: block committed .env
        entry: bash -c 'for f in "$@"; do case "$f" in .env|*/.env) echo "refusing to commit $f"; exit 1;; esac; done' --
        language: system
