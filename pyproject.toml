[project]
name = "scrapeline"
version = "0.1.0"
description = "Production-grade scraper platform: registry, polite fetch runtime, raw store, pipeline, quality checks, and AI agents that generate, test and repair scrapers under human review."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "anthropic>=1.1",
    "httpx>=0.28",
    "tenacity>=9.0",
    "playwright>=1.50",
    "selectolax>=0.3",
    "beautifulsoup4>=4.13",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "boto3>=1.36",
    "pyarrow>=19.0",
    "duckdb>=1.2",
    "structlog>=25.1",
    "typer>=0.15",
    "pyyaml>=6.0",
    "python-dateutil>=2.9",
    "pymupdf>=1.25",
    "protego>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "respx>=0.22",
    "ruff>=0.9",
    "mypy>=1.14",
    "types-PyYAML",
    "pre-commit>=4.0",
]
serve = ["fastapi>=0.115", "uvicorn[standard]>=0.34", "streamlit>=1.41"]
airflow = ["apache-airflow>=3.0"]
dbt = ["dbt-postgres>=1.9"]

[project.scripts]
scrapeline = "scrapeline.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scrapeline"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "T20", "RUF"]
ignore = ["S101"]  # assert in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "T20"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: needs docker compose services (postgres, minio, fixture sites)",
    "generated: agent-proposed tests under tests/generated; not trusted",
    "llm: calls the Anthropic API and costs money",
]
addopts = "-m 'not integration and not llm and not generated'"
