[project]
name = "scrapeline"
version = "0.1.0"
description = "Production-grade scraper platform: registry, polite fetch runtime, raw store, pipeline, quality checks, and AI agents that generate, test and repair scrapers under human review."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "anthropic>=1.1",
    "httpx>=0.28",
    "tenacity>=9.0",
    "playwright==1.65.2",           # pinned: must match the docker base image tag
    "selectolax>=1.0",
    "beautifulsoup4>=4.13",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pandas>=2.2",
    "structlog>=25.1",
    "typer>=0.15",
    "pyyaml>=6.0",
    "python-dateutil>=2.9",
    "pymupdf>=1.25",
    "protego>=0.4",
    "duckdb>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "respx>=0.22",
    "ruff>=0.9",
    "mypy>=1.14",
    "types-PyYAML",
    "types-python-dateutil",
    "pandas-stubs",
    "pre-commit>=4.0",
    "import-linter>=2.1",
]

[project.optional-dependencies]
# Optional extras, installed explicitly (`uv sync --extra serve`), never by default.
serve = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "uvicorn[standard]>=0.34",
]
s3 = ["boto3>=1.36"]
analytics = [
    "dbt-core>=1.9",
    "dbt-duckdb>=1.9",
]

[project.scripts]
scrapeline = "scrapeline.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scrapeline"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["tests/sites", "tests/generated", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "T20", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "T20"]
"alembic/**" = ["N", "E501"]
"scripts/**" = ["T20", "S", "E501"]
"src/scrapeline/agents/**" = ["E501"]  # prompt/report strings
"src/scrapeline/evals/**" = ["E501"]
"src/scrapeline/cli/**" = ["B008"]
"src/scrapeline/serve/**" = ["B008"]  # FastAPI Query() defaults  # typer.Option defaults are the typer idiom

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
exclude = ["tests/sites/", "tests/generated/"]

[[tool.mypy.overrides]]
module = ["protego.*", "fitz.*", "pymupdf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs docker compose services (postgres, fixture sites)",
    "generated: agent-proposed tests under tests/generated; not trusted",
    "llm: calls the Anthropic API and costs money",
    "browser: needs Playwright chromium installed",
]
addopts = "-m 'not integration and not llm and not generated and not browser'"
filterwarnings = ["ignore:builtin type swig:DeprecationWarning"]

[tool.coverage.run]
source = ["scrapeline"]

[[tool.mypy.overrides]]
module = ["scrapeline.pipeline.documents"]
disallow_untyped_calls = false  # pymupdf ships without type hints

[[tool.mypy.overrides]]
module = ["scrapeline.serve.*"]
disallow_untyped_decorators = false  # FastAPI route decorators
