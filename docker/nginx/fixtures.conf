# Serves tests/sites as static fixture websites.
# Each fixture site lives in its own folder: /static-list/, /js-table/, /pdf-archive/, /api-cursor/, /drift/<case>/
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    autoindex off;
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
    # Simulated rate limiting for politeness tests: /api-cursor/ allows 2 r/s per client.
    location /api-cursor/ {
        limit_req zone=cursor burst=4 nodelay;
        try_files $uri $uri.json =404;
        default_type application/json;
    }
}
limit_req_zone $binary_remote_addr zone=cursor:1m rate=2r/s;
