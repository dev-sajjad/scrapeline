# Dev profile: docker compose up -d
# Prod profile:   docker compose --profile prod up -d    (adds trusted worker)
# Agents profile: docker compose --profile agents up -d  (adds fixtures-only sandbox)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scrapeline
      POSTGRES_PASSWORD: scrapeline
      POSTGRES_DB: scrapeline
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scrapeline"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: scrapeline
      MINIO_ROOT_PASSWORD: scrapeline-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  # Fixture websites used by integration tests, evals and the demo.
  fixtures:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    networks: [default, sandbox_net]
    volumes:
      - ./tests/sites:/usr/share/nginx/html:ro
      - ./docker/nginx/fixtures.conf:/etc/nginx/conf.d/default.conf:ro

  worker:
    profiles: ["prod"]
    build: { context: ., dockerfile: docker/worker/Dockerfile }
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
    command: ["scrapeline", "worker", "--concurrency", "2"]
    deploy:
      resources:
        limits: { memory: 2g }

  # Isolated runner for agent-generated code (ADR-0004).
  # Internal network reaching only the fixture sites; no internet, no secrets, read-only FS.
  sandbox:
    profiles: ["agents"]
    build: { context: ., dockerfile: docker/sandbox/Dockerfile }
    networks: [sandbox_net]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      FIXTURE_BASE_URL: http://fixtures
    deploy:
      resources:
        limits: { memory: 1g }

networks:
  default:
  sandbox_net:
    internal: true

volumes:
  pgdata:
  miniodata:
