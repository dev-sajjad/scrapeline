name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest --cov --cov-report=term-missing

  integration:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run playwright install --with-deps chromium
      - run: docker compose up -d --wait
      # test_agents_db runs the tester through `docker run scrapeline-sandbox:latest`;
      # images are per-job, so the integration job builds its own.
      - run: docker build -f docker/sandbox/Dockerfile -t scrapeline-sandbox:latest .
      - run: uv run alembic upgrade head
      - run: uv run pytest -m "integration or browser"
      - if: always()
        run: docker compose down -v

  image:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/app/Dockerfile -t scrapeline-app:ci .
      - run: docker run --rm scrapeline-app:ci version
      - run: docker build -f docker/sandbox/Dockerfile -t scrapeline-sandbox:latest .
      - run: bash scripts/sandbox_check.sh

  generated-tests:
    runs-on: ubuntu-latest
    needs: checks
    continue-on-error: true   # informational; agent-proposed tests never gate merge
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run pytest -m generated tests/generated --no-header -q || true
